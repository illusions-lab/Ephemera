name: Release
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      retry_tag:
        description: Existing release tag to verify and publish
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ephemera-release
  queue: max
jobs:
  source:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.id == github.repository_id)
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      arm64: ${{ steps.source.outputs.arm64 }}
      darwin: ${{ steps.source.outputs.darwin }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: source
        env:
          RETRY_TAG: ${{ inputs.retry_tag }}
          CI_COMMIT: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$CI_COMMIT
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$GITHUB_REF" == refs/heads/main && "$RETRY_TAG" =~ ^v0\.1\.[0-9]+$ ]]
            commit=$(git rev-parse "refs/tags/$RETRY_TAG^{commit}")
            run=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f event=push -f branch=main -f status=success -f head_sha="$commit" --jq '.workflow_runs[0].id // empty')
            if [[ -z "$run" ]]; then
              echo "No successful main CI run found for $commit" >&2
              exit 1
            fi
          fi
          [[ "$commit" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$commit" "$GITHUB_SHA"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          release_config=$(git show "$commit:.goreleaser.yaml")
          arm64=false
          darwin=false
          if grep -Fq 'goarch: [amd64, arm64]' <<< "$release_config"; then arm64=true; fi
          if grep -Fq 'id: darwin-bundle' <<< "$release_config"; then darwin=true; fi
          printf 'arm64=%s\ndarwin=%s\n' "$arm64" "$darwin" >> "$GITHUB_OUTPUT"
  release:
    needs: source
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.tag.outputs.commit }}
      published: ${{ steps.existing.outputs.published }}
      verified_sha256: ${{ steps.verify.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Allocate tag
        id: tag
        env:
          RETRY_TAG: ${{ inputs.retry_tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            [[ "$RETRY_TAG" =~ ^v0\.1\.[0-9]+$ ]]
            commit=$(git rev-parse "refs/tags/$RETRY_TAG^{commit}")
            test "$(git rev-parse HEAD)" = "$commit"
            printf 'tag=%s\ncommit=%s\n' "$RETRY_TAG" "$commit" >> "$GITHUB_OUTPUT"
          else
            scripts/release-tag.sh
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - name: Check existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | [.tag_name, .draft] | @tsv')
          state=$(awk -v tag="$TAG" '$1 == tag { print $2; exit }' <<< "$releases")
          case "$state" in
            false) echo 'published=true' >> "$GITHUB_OUTPUT" ;;
            true) echo 'draft=true' >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: goreleaser/goreleaser-action@v6
        if: steps.existing.outputs.published != 'true' && steps.existing.outputs.draft != 'true'
        with:
          distribution: goreleaser
          version: v2.12.7
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.tag }}
      - name: Verify release bundle
        id: verify
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.tag.outputs.commit }}
          DARWIN: ${{ needs.source.outputs.darwin }}
          ARM64: ${{ needs.source.outputs.arm64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          darwin_assets=()
          if [[ "$DARWIN" == true ]]; then
            darwin_assets=(--pattern ephemera_darwin_arm64.tar.gz --pattern install-macos.sh)
          fi
          gh release download "$TAG" --dir "$RUNNER_TEMP/release" \
            --pattern 'ephemera_linux_*.tar.gz' --pattern checksums.txt --pattern install.sh "${darwin_assets[@]}"
          cd "$RUNNER_TEMP/release"
          sha256sum --strict -c checksums.txt
          arches=(amd64)
          if [[ "$ARM64" == true ]]; then
            arches+=(arm64)
            sudo apt-get update
            sudo apt-get install -y qemu-user
          fi
          for arch in "${arches[@]}"; do
            grep -Eq "^[[:xdigit:]]{64} [ *]ephemera_linux_$arch\.tar\.gz$" checksums.txt
            mkdir "verify-$arch"
            tar -xzf "ephemera_linux_$arch.tar.gz" -C "verify-$arch"
            test -s "verify-$arch/ephemera.service" && test -s "verify-$arch/install.sh"
            cmp install.sh "verify-$arch/install.sh"
            executor=()
            machine='Advanced Micro Devices X86-64'
            if [[ "$arch" == arm64 ]]; then
              executor=(qemu-aarch64)
              machine=AArch64
            fi
            for binary in ephemera ephemerad; do
              LC_ALL=C readelf -h "verify-$arch/$binary" | grep -E "Machine:[[:space:]]+$machine$"
            done
            test "$("${executor[@]}" "verify-$arch/ephemera" version)" = "$TAG $RELEASE_COMMIT"
            test "$("${executor[@]}" "verify-$arch/ephemerad" --version)" = "$TAG $RELEASE_COMMIT"
          done
          # The public download must match the bytes inspected by CI.
          files=(checksums.txt install.sh ephemera_linux_amd64.tar.gz)
          if [[ "$ARM64" == true ]]; then files+=(ephemera_linux_arm64.tar.gz); fi
          if [[ "$DARWIN" == true ]]; then files+=(ephemera_darwin_arm64.tar.gz install-macos.sh); fi
          {
            echo 'sha256<<CHECKSUMS'
            sha256sum "${files[@]}"
            echo CHECKSUMS
          } >> "$GITHUB_OUTPUT"

  verify-darwin:
    needs: [source, release]
    if: needs.source.outputs.darwin == 'true'
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
      - name: Verify Darwin release natively
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.release.outputs.commit }}
          VERIFIED_SHA256: ${{ needs.release.outputs.verified_sha256 }}
        run: |
          assets="$RUNNER_TEMP/release"
          gh release download "$TAG" --dir "$assets" \
            --pattern ephemera_darwin_arm64.tar.gz --pattern checksums.txt --pattern install-macos.sh
          (
            cd "$assets"
            awk '$2 == "checksums.txt" || $2 == "ephemera_darwin_arm64.tar.gz" || $2 == "install-macos.sh" {print}' \
              <<< "$VERIFIED_SHA256" > verified.sha256
            test "$(wc -l < verified.sha256)" -eq 3
            shasum -a 256 -c verified.sha256
          )
          scripts/verify-macos-bundle.sh "$assets" "$assets/install-macos.sh" "$TAG $RELEASE_COMMIT"

  publish:
    needs: [source, release, verify-darwin]
    if: >-
      !cancelled() && needs.release.result == 'success' && needs.release.outputs.published != 'true' &&
      (needs.verify-darwin.result == 'success' ||
       (needs.source.outputs.darwin != 'true' && needs.verify-darwin.result == 'skipped'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      expected_latest: ${{ steps.publish.outputs.expected_latest }}
    steps:
      - name: Publish verified draft
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.release.outputs.commit }}
        run: |
          # Recheck the remote ref after the verification jobs.
          ref="refs/tags/$TAG"
          refs=$(git ls-remote --exit-code "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$ref" "$ref^{}")
          actual=$(awk -v ref="$ref" '$2 == ref {direct=$1} $2 == ref "^{}" {peeled=$1} END { print (peeled ? peeled : direct) }' <<< "$refs")
          test "$actual" = "$RELEASE_COMMIT"
          published=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')
          latest=$(printf '%s\n' "$published" | grep -E '^v0\.1\.[0-9]+$' | sort -V | tail -n1 || true)
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$TAG" "$latest" | sort -V | tail -n1)" != "$TAG" ]; then
            expected_latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft=false --latest=false
          else
            expected_latest=$TAG
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft=false --latest
          fi
          echo "expected_latest=$expected_latest" >> "$GITHUB_OUTPUT"

  verify-public:
    needs: [source, release, verify-darwin, publish]
    if: >-
      !cancelled() && needs.release.result == 'success' &&
      (needs.verify-darwin.result == 'success' ||
       (needs.source.outputs.darwin != 'true' && needs.verify-darwin.result == 'skipped')) &&
      (needs.publish.result == 'success' ||
       (needs.release.outputs.published == 'true' && needs.publish.result == 'skipped'))
    runs-on: ubuntu-24.04
    steps:
      - name: Verify public tag and release downloads
        env:
          TAG: ${{ needs.release.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.release.outputs.commit }}
          VERIFIED_SHA256: ${{ needs.release.outputs.verified_sha256 }}
          EXPECTED_LATEST: ${{ needs.publish.outputs.expected_latest }}
        run: |
          base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          ref="refs/tags/$TAG"
          refs=$(git ls-remote --exit-code "$base.git" "$ref" "$ref^{}")
          actual=$(awk -v ref="$ref" '$2 == ref {direct=$1} $2 == ref "^{}" {peeled=$1} END { print (peeled ? peeled : direct) }' <<< "$refs")
          test "$actual" = "$RELEASE_COMMIT"
          test -n "$VERIFIED_SHA256"
          mkdir "$RUNNER_TEMP/public-release"
          cd "$RUNNER_TEMP/public-release"
          while read -r digest asset; do
            [[ "$digest" =~ ^[[:xdigit:]]{64}$ && "$asset" =~ ^[a-zA-Z0-9_.-]+$ ]]
            curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
              --output "$asset" "$base/releases/download/$TAG/$asset"
          done <<< "$VERIFIED_SHA256"
          sha256sum --strict -c - <<< "$VERIFIED_SHA256"
          if [[ -z "$EXPECTED_LATEST" ]]; then exit 0; fi
          for attempt in {1..6}; do
            actual=$(curl --fail --silent --show-error --location --output /dev/null \
              --write-out '%{url_effective}' "$base/releases/latest") || actual=
            if [[ "$actual" == "$base/releases/tag/$EXPECTED_LATEST" ]]; then
              exit 0
            fi
            if (( attempt < 6 )); then sleep 5; fi
          done
          echo "Expected latest release $EXPECTED_LATEST, got ${actual:-no release}" >&2
          exit 1
