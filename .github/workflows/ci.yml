name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      arm64: ${{ steps.source.outputs.arm64 }}
      darwin: ${{ steps.source.outputs.darwin }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: source
        run: |
          commit=$GITHUB_SHA
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          release_config=$(git show "$commit:.goreleaser.yaml")
          arm64=false
          darwin=false
          if grep -Fq 'goarch: [amd64, arm64]' <<< "$release_config"; then arm64=true; fi
          if grep -Fq 'id: darwin-bundle' <<< "$release_config"; then darwin=true; fi
          printf 'arm64=%s\ndarwin=%s\n' "$arm64" "$darwin" >> "$GITHUB_OUTPUT"
  check:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make check
      - uses: goreleaser/goreleaser-action@v6
        if: >-
          (github.event_name != 'push' || github.ref != 'refs/heads/main') &&
          (matrix.arch == 'amd64' || needs.source.outputs.arm64 == 'true')
        with:
          version: v2.12.7
          args: release --snapshot --clean
      - name: Verify snapshot archive
        if: >-
          (github.event_name != 'push' || github.ref != 'refs/heads/main') &&
          (matrix.arch == 'amd64' || needs.source.outputs.arm64 == 'true')
        run: |
          cd dist
          sha256sum -c checksums.txt
          mkdir verify
          tar -xzf ephemera_linux_${{ matrix.arch }}.tar.gz -C verify
          test -s verify/ephemera.service && test -s verify/install.sh
          test "$(verify/ephemera version)" = "$(verify/ephemerad --version)"

  ubuntu-install:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Exercise installation and rollback on Ubuntu
        run: scripts/ci-install-test.sh
  macos-install:
    needs: source
    if: needs.source.outputs.darwin == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - name: Check macOS activation, Tart, and recovery for races
        run: go test -race ./internal/macos ./internal/vm ./internal/service
      - run: scripts/ci-macos-install-test.sh
      - run: scripts/ci-macos-power-test.sh
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.12.7
          args: release --snapshot --clean
      - name: Verify Darwin snapshot natively
        run: scripts/verify-macos-bundle.sh dist scripts/install-macos.sh
