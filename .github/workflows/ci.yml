name: CI and release
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make check
      - uses: goreleaser/goreleaser-action@v6
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        with:
          version: v2.12.7
          args: release --snapshot --clean
      - name: Verify snapshot archive
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: |
          cd dist
          sha256sum -c checksums.txt
          mkdir verify
          tar -xzf ephemera_linux_amd64.tar.gz -C verify
          test -s verify/ephemera.service && test -s verify/install.sh
          test "$(verify/ephemera version)" = "$(verify/ephemerad --version)"

  ubuntu-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Exercise installation and rollback on Ubuntu amd64
        run: scripts/ci-install-test.sh
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, ubuntu-install]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: ephemera-release
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Allocate tag
        id: tag
        run: scripts/release-tag.sh
      - name: Check existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | [.tag_name, .draft] | @tsv')
          state=$(awk -v tag="$TAG" '$1 == tag { print $2; exit }' <<< "$releases")
          case "$state" in
            false) echo 'published=true' >> "$GITHUB_OUTPUT" ;;
            true) echo 'draft=true' >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: goreleaser/goreleaser-action@v6
        if: steps.existing.outputs.published != 'true' && steps.existing.outputs.draft != 'true'
        with:
          distribution: goreleaser
          version: v2.12.7
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.tag }}
      - name: Verify release bundle
        if: steps.existing.outputs.published != 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$TAG" --dir "$RUNNER_TEMP/release" \
            --pattern ephemera_linux_amd64.tar.gz --pattern checksums.txt --pattern install.sh
          cd "$RUNNER_TEMP/release"
          sha256sum -c checksums.txt
          mkdir verify
          tar -xzf ephemera_linux_amd64.tar.gz -C verify
          test -s verify/ephemera.service && cmp install.sh verify/install.sh
          test "$(verify/ephemera version)" = "$TAG $GITHUB_SHA"
          test "$(verify/ephemerad --version)" = "$TAG $GITHUB_SHA"
      - name: Install image preparation tools
        if: steps.existing.outputs.published != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils libguestfs-tools cloud-image-utils linux-image-generic
      - name: Verify packaged daemon and runner image
        if: steps.existing.outputs.published != 'true'
        timeout-minutes: 45
        run: scripts/ci-release-test.sh "$RUNNER_TEMP/release/verify"
      - name: Publish verified draft
        if: steps.existing.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          published=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')
          latest=$(printf '%s\n' "$published" | grep -E '^v0\.1\.[0-9]+$' | sort -V | tail -n1 || true)
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$TAG" "$latest" | sort -V | tail -n1)" != "$TAG" ]; then
            gh release edit "$TAG" --draft=false --latest=false
          else
            gh release edit "$TAG" --draft=false --latest
          fi
