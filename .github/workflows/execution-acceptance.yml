name: Dedicated Scale Set acceptance
run-name: Dedicated Scale Set acceptance ${{ inputs.correlation }}
on:
  workflow_dispatch:
    inputs:
      correlation:
        description: Optional identifier for a coordinating acceptance run
        type: string
      hold_seconds:
        description: Seconds to keep the guest running
        type: number
        default: 60
      scale_set:
        description: Runner label of the dedicated test Scale Set
        required: true
        type: string
      guest_os:
        description: Expected guest operating system
        type: choice
        options: [linux, macos]
        default: linux
      arch:
        description: Expected guest architecture
        type: choice
        options: [amd64, arm64]
        default: amd64
      platform_labels:
        description: Route by self-hosted, OS, and architecture labels
        type: boolean
        default: false
      apple_build:
        description: Compile macOS and iOS smoke programs with the guest Xcode
        type: boolean
        default: false
      overlap:
        description: Run two overlapping jobs
        default: false
        type: boolean

permissions: {}

jobs:
  guest:
    runs-on: ${{ fromJSON(inputs.platform_labels && format('["self-hosted","{0}","{1}"]', inputs.guest_os == 'macos' && 'macOS' || 'Linux', inputs.arch == 'arm64' && 'ARM64' || 'X64') || toJSON(inputs.scale_set)) }}
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(inputs.overlap && '[1,2]' || '[1]') }}
    steps:
      - name: Record guest identity
        shell: bash
        env:
          EXPECTED_OS: ${{ inputs.guest_os }}
          EXPECTED_ARCH: ${{ inputs.arch }}
          HOLD_SECONDS: ${{ inputs.hold_seconds }}
        run: |
          set -euo pipefail
          case "$EXPECTED_OS:$EXPECTED_ARCH" in
            linux:amd64) test "$(uname -sm)" = "Linux x86_64" ;;
            linux:arm64) test "$(uname -sm)" = "Linux aarch64" ;;
            macos:arm64) test "$(uname -sm)" = "Darwin arm64" ;;
            *) exit 1 ;;
          esac
          started_at=$(date -u +%FT%TZ)
          if [[ "$EXPECTED_OS" == macos ]]; then
            boot_id=$(sysctl -n kern.bootsessionuuid)
            instance_id=${RUNNER_NAME#ephemera-}
          else
            boot_id=$(cat /proc/sys/kernel/random/boot_id)
            instance_id=$(cloud-init query instance_id)
          fi
          [[ "$instance_id" =~ ^[0-9a-f-]{36}$ ]]
          [[ "$RUNNER_NAME" == "ephemera-$instance_id" ]]
          {
            printf 'Runner %s\n\n' "$RUNNER_NAME"
            printf 'Instance %s\n\n' "$instance_id"
            printf 'Boot %s\n' "$boot_id"
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$HOLD_SECONDS" =~ ^[0-9]+$ ]] && (( HOLD_SECONDS <= 3600 ))
          sleep "$HOLD_SECONDS"
          printf "Started %s\n\nFinished %s\n" "$started_at" "$(date -u +%FT%TZ)" >> "$GITHUB_STEP_SUMMARY"
      - name: Compile macOS and iOS smoke programs
        if: inputs.guest_os == 'macos' && inputs.apple_build
        shell: bash
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          scratch=$(mktemp -d)
          printf 'print("Apple toolchain is working")\n' > "$scratch/main.swift"
          xcrun --sdk macosx swiftc "$scratch/main.swift" -o "$scratch/mac"
          "$scratch/mac"
          sdk=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos swiftc -target arm64-apple-ios18.0 -sdk "$sdk" \
            -emit-object "$scratch/main.swift" -o "$scratch/ios.o"
          test -s "$scratch/ios.o"
