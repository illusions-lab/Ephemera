name: Ubuntu VM acceptance
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        type: string
        required: false
      linux_amd64_only:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  ubuntu-vm:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.linux_amd64_only && '[{"arch":"amd64","runner":"ubuntu-24.04","qemu":"qemu-system-x86"}]' || '[{"arch":"amd64","runner":"ubuntu-24.04","qemu":"qemu-system-x86"},{"arch":"arm64","runner":"ubuntu-24.04-arm","qemu":"qemu-system-arm qemu-efi-aarch64"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.12.7
          args: release --snapshot --clean
      - name: Verify and unpack snapshot
        run: |
          expected_commit=$(git rev-parse HEAD)
          cd dist
          sha256sum -c checksums.txt
          mkdir "$RUNNER_TEMP/vm-bundle"
          tar -xzf ephemera_linux_${{ matrix.arch }}.tar.gz -C "$RUNNER_TEMP/vm-bundle"
          cd "$RUNNER_TEMP/vm-bundle"
          test -s ephemera.service
          test -s install.sh
          identity=$(./ephemera version)
          test "$identity" = "$(./ephemerad --version)"
          test "${identity##* }" = "$expected_commit"
      - name: Install image preparation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.qemu }} qemu-utils libguestfs-tools cloud-image-utils linux-image-generic
          # Use libguestfs's QEMU user networking on the disposable runner.
          if command -v passt >/dev/null; then
            sudo dpkg-divert --local --rename --add "$(command -v passt)"
          fi
      - name: Verify packaged daemon and runner image
        timeout-minutes: 45
        run: scripts/ci-release-test.sh "$RUNNER_TEMP/vm-bundle"
