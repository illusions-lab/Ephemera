name: Ubuntu VM acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ubuntu-vm.yml'
      - 'cmd/**'
      - 'internal/image/**'
      - 'internal/service/**'
      - 'internal/vm/**'
      - 'internal/status/**'
      - 'internal/orders/**'
      - 'internal/cli/**'
      - 'internal/config/**'
      - 'go.mod'
      - 'go.sum'
      - '.goreleaser.yaml'
      - 'packaging/ephemera.service'
      - 'configs/ephemera.example.yaml'
      - 'scripts/install.sh'
      - 'scripts/ci-release-test.sh'
      - 'scripts/ci-github.py'
  pull_request:
    paths:
      - '.github/workflows/ubuntu-vm.yml'
      - 'cmd/**'
      - 'internal/image/**'
      - 'internal/service/**'
      - 'internal/vm/**'
      - 'internal/status/**'
      - 'internal/orders/**'
      - 'internal/cli/**'
      - 'internal/config/**'
      - 'go.mod'
      - 'go.sum'
      - '.goreleaser.yaml'
      - 'packaging/ephemera.service'
      - 'configs/ephemera.example.yaml'
      - 'scripts/install.sh'
      - 'scripts/ci-release-test.sh'
      - 'scripts/ci-github.py'
permissions:
  contents: read
jobs:
  ubuntu-vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.12.7
          args: release --snapshot --clean
      - name: Verify and unpack snapshot
        run: |
          cd dist
          sha256sum -c checksums.txt
          mkdir "$RUNNER_TEMP/vm-bundle"
          tar -xzf ephemera_linux_amd64.tar.gz -C "$RUNNER_TEMP/vm-bundle"
          cd "$RUNNER_TEMP/vm-bundle"
          test -s ephemera.service
          test -s install.sh
          identity=$(./ephemera version)
          test "$identity" = "$(./ephemerad --version)"
          test "${identity##* }" = "$GITHUB_SHA"
      - name: Install image preparation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils libguestfs-tools cloud-image-utils linux-image-generic
          # Use libguestfs's QEMU user networking on the disposable runner.
          if command -v passt >/dev/null; then
            sudo dpkg-divert --local --rename --add "$(command -v passt)"
          fi
      - name: Verify packaged daemon and runner image
        timeout-minutes: 45
        run: scripts/ci-release-test.sh "$RUNNER_TEMP/vm-bundle"
