# Copy to /etc/ephemera/config.yaml and replace the example values.
# The systemd service loads the GitHub App private key as the
# github-app-key credential from the active snapshot. The editable key lives
# at /etc/ephemera/credentials/github-app.pem. Run sudo ephe config apply
# to activate saved changes.
# Persistent service state belongs in /var/lib/ephemera.
version: 1

github:
  scope_url: https://github.com/example-org/ephemera-test
  scale_set_name: ephemera-ubuntu-amd64
  # runner_group: Default
  # labels: [build, ci]  # Additional labels beyond the Scale Set name and platform defaults.
  app_id: 123456
  installation_id: 789012

runner:
  # Set true to follow the verified image channel in execution mode.
  # image_auto_update: true
  execute: false # Set true on a Linux amd64/KVM execution host.
  max_concurrent: 2
  startup_timeout: 3m
  idle_timeout: 5m

vm:
  backend: qemu
  image: ubuntu
  arch: amd64
  vcpus: 2
  memory_mib: 4096
  # disk_gib: 12  # Guest disk capacity in GiB; Tart inherits its image by default.
  # host_reserve_mib: 1024
  # host_disk_reserve_gib: 5
  # memory_oversubscribe_mib: 0
  # data_dir: /mnt/ephemera-vms
  # image_cache_dir: /mnt/ephemera-cache  # QEMU only
  # extra_retained_images: 0
  # cache_max_gib: 0  # Soft budget for additional retention; 0 disables the size limit.

# The built-in Ubuntu amd64 recipe uses pinned upstream releases.
# To select different sources, add:
# image:
#   ubuntu:
#     amd64:
#       base_url: https://example.org/pinned-ubuntu-cloud-image.img
#       base_sha256: "<SHA-256 of the base disk>"
#       runner_version: "<GitHub Actions runner release version>"
#       runner_sha256: "<SHA-256 of the Linux x64 runner archive>"
